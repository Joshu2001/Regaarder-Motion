<!doctype html><html lang="en"><meta charset="utf-8"><title>Regaarder · continuous 16–18 preview</title><style>body{background:#0b1017;color:#e1edf3;font:16px system-ui;max-width:1100px;margin:30px auto}canvas{width:100%;background:black}button,input{padding:10px}input{width:75%}a{color:#72d4ee}</style><h1>Regaarder · 16:00–18:00</h1><canvas id="stage" width="960" height="540"></canvas><p><button id="play">Play</button> <input id="seek" aria-label="Timeline" type="range" min="0" max="120" step=".01" value="58"><span id="clock"></span></p><p><a href="minute16-editor.html">Minute 16 controls</a> · <a href="minute17-editor.html">Minute 17 controls</a></p><p id="status">Loading…</p><script type="module">
import{preloadMinute16,preloadMinute16Archive,paintMinute16,minute16Defaults}from'./minute16-sequence.js';import{preloadMinute17,paintMinute17,minute17Defaults}from'./minute17-sequence.js';
const cv=document.getElementById('stage'),c=cv.getContext('2d'),seek=document.getElementById('seek'),btn=document.getElementById('play'),clock=document.getElementById('clock');let t=58,playing=false,last=0;const archive=preloadMinute16Archive();archive.addEventListener('seeked',draw);function draw(){if(t<60){if(t<5.67&&archive.readyState>=2&&!archive.seeking&&Math.abs(archive.currentTime-t)>.03)archive.currentTime=t;paintMinute16(c,t,{archive},minute16Defaults)}else paintMinute17(c,t-60,{},minute17Defaults);seek.value=t;clock.textContent=`${Math.floor((960+t)/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`}
await Promise.all([Promise.all([...preloadMinute16().values()].map(im=>im.decode())),preloadMinute17()]);document.getElementById('status').textContent='Ready · silent preview · default presets';draw();btn.onclick=()=>{playing=!playing;if(t>=120)t=0;btn.textContent=playing?'Pause':'Play';last=0};seek.oninput=()=>{t=+seek.value;playing=false;btn.textContent='Play';draw()};function tick(now){if(playing){if(last)t=Math.min(120,t+(now-last)/1000);draw();if(t>=120){playing=false;btn.textContent='Play'}}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
